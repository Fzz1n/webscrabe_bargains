<!DOCTYPE html>
<html lang="en-da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bargain hunter</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <h1>Bargain hunter</h1>
    
    <!--Table for multiple years of data-->
    <table id="wishlist_products_id">
        <thead>
            <tr>
                <th colspan="6">Søg efter produkter:</th>
            </tr>
        </thead>
        <tbody>
            <td>
                <input type="text" placeholder="fx. 'Kylling'">
                <small class="input-error"></small>
            </td>
            <td>
                <input type="text" placeholder="fx. 'Gris'">
                <small class="input-error"></small>
            </td>
            <td>
                <input type="text" placeholder="fx. 'Oksekød'">
                <small class="input-error"></small>
            </td>
            <td>
                <input type="text" placeholder="fx. 'Tomat'">
                <small class="input-error"></small>
            </td>
            <td>
                <input type="text" placeholder="fx. 'Mælk'">
                <small class="input-error"></small>
            </td>
            <td> 
                <button type="submit" id="send_wish_req">Søg</button> 
                <small class="input-error"></small> 
            </td>
            </tr>
        </tbody>
    </table>

    <table id="result_id" style="visibility:hidden"> 
        <thead>
            <tr>
                <th>Navn</th>
                <th>Pris</th>
                <th> <button type="submit" id="filter_amount">Størrelse ⬆️</button> </th>
                <th> <button type="submit" id="filter_unit_price">Enhedspris ⬆️</button> </th>
            </tr>
        </thead>
        <tbody></tbody>
    </table> 
    
    <script type="module" src="../js/script.js"></script>
</body>
</html>
